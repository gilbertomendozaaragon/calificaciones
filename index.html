<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de calificaciones - CBTis 64</title>
<style>
body{margin:0;font-family:system-ui,Arial;background:#f6f7fb;color:#111}
.container{max-width:1100px;margin:auto;padding:24px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin:14px 0}
.brand{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{width:88px;height:88px;object-fit:contain;border-radius:14px;border:1px solid #eee;background:#fff}
h1{margin:0 0 6px 0;font-size:28px}
label{font-weight:800;display:block;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:240px;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{padding:12px 16px;border-radius:10px;border:0;background:#111;color:#fff;font-weight:900;cursor:pointer}
.msg{margin-top:10px;font-size:14px}
.warn{color:#9a6b00}
.err{color:#b00020}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<header class="card">
  <div class="brand">
    <div>
      <h1>Consulta de calificaciones</h1>
      <p>Ingresa tu <b>No. de control</b> y tu <b>CURP</b>.</p>
    </div>
  </div>
</header>

<section class="card">
<form id="f">
<div class="row">
  <div>
    <label>No. de control</label>
    <input id="c">
  </div>
  <div>
    <label>CURP</label>
    <input id="u" maxlength="18">
  </div>
  <div style="align-self:end">
    <button>Consultar</button>
  </div>
</div>
</form>
<div id="msg" class="msg">Archivo de ejemplo listo. Sustituye este HTML por el definitivo con datos.</div>
</section>

<section id="r" class="card hidden">
  <h2>Resultado</h2>
  <p>OK</p>
</section>
</div>
</body>
</html>
